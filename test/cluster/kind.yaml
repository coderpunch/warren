# A kind cluster for the cluster checks.
# The cluster has no default network plugin, because kindnet does not enforce
# NetworkPolicy on all kernels. The script setup.sh installs Calico.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
# The two patches that follow are necessary only on a host that has cgroup v1
# or that runs Docker in a container. They have no effect on other hosts.
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri"]
    restrict_oom_score_adj = true
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    failCgroupV1: false
