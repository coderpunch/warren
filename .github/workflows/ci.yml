name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Each action has a full commit ID. A tag can change, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Format
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Run gofmt on these files:"
            echo "$files"
            exit 1
          fi
      - name: Module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/warren ./cmd/warren

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t warren:ci .
      - name: Start the binary in the image
        run: docker run --rm warren:ci --help
